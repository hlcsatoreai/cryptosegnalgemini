services:
  - type: web
    name: crypto-signal-pro
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: ./node_modules/.bin/serve -s dist -l 3000
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GEMINI_API_KEY
        sync: false # User must set this in Render dashboard
